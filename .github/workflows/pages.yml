name: Workshop site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "run-of-show.md"
      - "handoff.sh"
      - "build/sync-site.py"
      - "build/test_sync_site.py"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "run-of-show.md"
      - "handoff.sh"
      - "build/sync-site.py"
      - "build/test_sync_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test the prompt sync
        run: python3 -m unittest discover -s build -p "test_sync_site.py"
      - name: Check the site matches run-of-show.md and handoff.sh
        run: python3 build/sync-site.py --check

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
